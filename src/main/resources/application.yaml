spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${mail_username}
    password: ${mail_password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 5000
      mail.smtp.socketFactory.port: 465
      mail.smtp.socketFactory.class: javax.net.ssl.SSLSocketFactory
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: 'FALSE'
    hibernate:
      ddl-auto: update
    open-in-view: 'false'
  mvc:
    hiddenmethod:
      filter:
        enabled: 'true'
    throw-exception-if-no-handler-found: true
    web:
      resources:
        add-mappings: false
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    password: ${db_password}
    username: ${db_username}
    url: jdbc:mysql://localhost:3306/bassheads_bg?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true&serverTimezone=UTC
    initialization-mode: never
  kafka:
    bootstrap-servers: kafka:9092
    groupId: test
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.StringSerializer
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

logging:
  level:
    org:
      hibernate:
        type:
          descriptor: TRACE
        #        SQL: DEBUG
        SQL:
      nodeValue: WARN
    blog: WARN

forex:
  api:
    key: ${forex_api_key}
    url: "https://openexchangerates.org/api/latest.json?app_id={FOREX_API_KEY}"
    base: "USD"

server:
  port: 8080

admin:
  username: ${admin_username}
  password: ${admin_password}
  email: ${admin_email}
  firstName: ${admin_firstName}
  lastName: ${admin_lastName}
  birthDate: ${admin_birthDate}

accuweather:
  accu_key: ${accu_key}

# This is used for the email confirmation, in the RegistrationListener class
myserver:
  address: ${server_ip:localhost}  # Defaults to 'localhost' if the environment variable is not set
  port: ${server_port:8080}        # Defaults to '8080' if the environment variable is not set
